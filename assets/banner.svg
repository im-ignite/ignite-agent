<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="IGNITE V3 PRO banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0a16"/><stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a2f"/><stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffb27a" stop-opacity=".9"/><stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.6" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="260" r="1.4" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="40" r="1.8" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="285" r="1.5" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="40" r="1.6" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 3D-style orbital core -->
  <g transform="translate(980 160)">
    <circle r="110" fill="url(#glow)"><animate attributeName="r" values="95;120;95" dur="3s" repeatCount="indefinite"/></circle>
    <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="none" stroke="#ff7a2f" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#ffc46b">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <ellipse rx="86" ry="30" fill="none" stroke="#ff7a2f" stroke-opacity=".6" stroke-width="1.5" transform="rotate(-20)"/>
    <ellipse rx="110" ry="38" fill="none" stroke="#3fe0d0" stroke-opacity=".6" stroke-width="1.5" transform="rotate(25)"/>
    <ellipse rx="132" ry="46" fill="none" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5" transform="rotate(70)"/>
    <g transform="rotate(-20)"><circle r="6" fill="#ff7a2f"><animateMotion dur="5s" repeatCount="indefinite" path="M86,0 A86,30 0 1,1 -86,0 A86,30 0 1,1 86,0"/></circle></g>
    <g transform="rotate(25)"><circle r="6" fill="#3fe0d0"><animateMotion dur="7s" repeatCount="indefinite" path="M110,0 A110,38 0 1,1 -110,0 A110,38 0 1,1 110,0"/></circle></g>
    <g transform="rotate(70)"><circle r="6" fill="#a78bfa"><animateMotion dur="9s" repeatCount="indefinite" path="M132,0 A132,46 0 1,1 -132,0 A132,46 0 1,1 132,0"/></circle></g>
  </g>

  <text x="70" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="84" letter-spacing="-2" fill="url(#fire)">IGNITE
    <animate attributeName="opacity" values="1;.82;1" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <text x="74" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="600" font-size="26" fill="#f3eefc">V3 PRO · Autonomous AI Engineering Agent</text>
  <text x="74" y="232" font-family="Consolas, Menlo, monospace" font-size="20" fill="#a99fbd">$ npm install -g ignite-agent<tspan fill="#ff7a2f">▌<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
</svg>
